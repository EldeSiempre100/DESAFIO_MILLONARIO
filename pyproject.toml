[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "millonario-educativo"
version = "0.2.0"
description = "Juego audiovisual educativo con banco Excel y rondas sin repetición"
requires-python = ">=3.12,<3.14"
dependencies = [
    "PySide6>=6.8,<7",
]

[project.optional-dependencies]
assets = [
    "imageio-ffmpeg>=0.6,<1",
]
dev = [
    "pytest>=8,<10",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyside6-project]
files = [
    "main.py",
    "src/millonario/__init__.py",
    "src/millonario/app.py",
    "src/millonario/audio.py",
    "src/millonario/controller.py",
    "src/millonario/engine.py",
    "src/millonario/excel_import.py",
    "src/millonario/model.py",
    "src/millonario/rounds.py",
    "src/millonario/storage.py",
    "qml/Main.qml",
]
